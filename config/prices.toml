# Direct DeepSeek: peak USD rates used at all times as a conservative estimate.
# Actual off-peak prices are half these rates. Automatic caching has no extra write fee.
[deepseek]
source = "https://api-docs.deepseek.com/quick_start/pricing/"
date = 2026-11-02

[deepseek.models.deepseek-flash]
input = 0.30
output = 1.20
cache_write_5m = 0.30
cache_write_1h = 0.30
cache_read = 0.006

# Alibaba: conservative USD estimates using the higher published regional rates.
# These are not Beijing CNY invoices or a currency conversion. Operators can replace
# them with their region's USD rates. Free quotas, batch and negotiated discounts excluded.
# Implicit reads use 20% of input; explicit writes use 125%. No native TTL control is claimed.
# Flash rates were retrieved from the official pricing page's indexed model table;
# the current rendered table no longer lists Flash. Confirm in the console before relying on it.
